<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>炉石实验对战台</title><link rel="stylesheet" href="/style.css">
<body><header><div><p class="eyebrow">LOCAL · PYTHON ENGINE</p><h1>炉石实验对战台</h1><p>当前支持范围的实验模拟器 · 代表卡演示 · 未认证正式卡池与国服规则</p></div><div class="controls"><select id="preset" aria-label="演示模式"><option value="constructed">构筑演示 · 含换牌</option><option value="practice">练习场 · 10法力 / 真实发现</option></select><button id="create">创建 / 重置对局</button></div></header>
<main><section id="welcome" class="panel"><h2>两人共用一台浏览器</h2><p>创建对局后，玩家1先操作。点击「交接座位」会遮住手牌与日志，由下一位玩家确认接手。每个操作都交给 Python 内核结算。</p></section><section id="curtain" class="panel" hidden><h2 id="handoff-title"></h2><p>请将设备交给下一位玩家，再确认查看自己的手牌。</p><button id="ready">我已接手，显示我的座位</button></section><div id="game" hidden><section class="toolbar panel"><strong id="status"></strong><div><button id="refresh">刷新</button><button id="switch">交接座位</button></div></section><section id="interaction" class="panel" aria-live="polite"><div id="interaction-hint">点击亮起的手牌出牌，或点击己方随从发起攻击。</div><div id="interaction-options"></div><button id="cancel-selection" hidden>取消选择</button></section><div id="battle-table"><div id="players"></div><div class="end-turn-dock"><button id="end">结束回合</button></div><div class="table-label">实验对战 · 本地规则结算</div></div><section id="choice" class="panel" hidden></section><div class="bottom"><details class="panel"><summary>更多操作 / 完整合法列表 <span id="action-count"></span></summary><p class="hint">点击手牌或场上实体筛选。目标与位置均来自引擎；位置从左到右计数。</p><div class="controls"><select id="type" aria-label="操作类型"></select><select id="source" aria-label="操作来源"></select></div><div id="actions"></div><button id="fallback" hidden>尝试结束回合</button></details><section class="panel"><h2>当前座位的对局日志</h2><div id="logs"></div></section></div><details class="panel"><summary>玩家可见 DTO / 操作协议</summary><pre id="dto"></pre></details></div><p id="error" role="alert" aria-live="polite"></p></main><script src="/app.js"></script></body></html>
